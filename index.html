<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAP Project Footer</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: "Open Sans", sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  main {
    flex: 1;
    padding: 40px 20px;
    text-align: center;
  }

  /* ---------- FOOTER ---------- */
  .footer {
    background: #74212a;
    color: #ffffff;
  }

  .footer-top {
    position: relative;
    overflow: hidden;
    padding: 40px 20px 28px;
  }

  /* faint binary pattern in the background */
  .footer-top::before {
    content: "0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011 1110 0101 1100 1010 0011";
    position: absolute;
    inset: 0;
    font-family: "Courier New", monospace;
    font-size: 13px;
    line-height: 1.9;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.07);
    word-break: break-all;
    pointer-events: none;
  }

  .footer-inner {
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 32px;
  }

  .footer-col h3 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 600;
  }

  .footer-col h4 {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 600;
  }

  .footer-col p {
    margin: 0 0 10px;
    font-size: 14px;
    line-height: 1.5;
    color: #f3d5d8;
  }

  .footer-col a {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #f3d5d8;
    text-decoration: none;
  }

  .footer-col a:hover {
    color: #ffffff;
    text-decoration: underline;
  }

  .mono {
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: 2px;
  }

  .gates {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .gate {
    font-family: "Courier New", monospace;
    font-size: 12px;
    padding: 3px 9px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 4px;
    color: #ffffff;
  }

  .footer-bottom {
    background: #5a1920;
    text-align: center;
    padding: 14px 20px;
    font-size: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
  }
</style>
</head>
<body>

<main>
  <h1>CAP Project</h1>
  <p>Your page content goes here.</p>
</main>

<footer class="footer">
  <div class="footer-top">
    <div class="footer-inner">

      <div class="footer-col">
        <h3>CAP Project</h3>
        <p>Digital number systems and logic gates</p>
        <p class="mono">BIN • OCT • DEC • HEX</p>
      </div>

      <div class="footer-col">
        <h4>Explore</h4>
        <a href="#number-systems">Number systems</a>
        <a href="#logic-gates">Logic gates</a>
        <a href="#truth-tables">Truth tables</a>
        <a href="#converter">Converter</a>
      </div>

      <div class="footer-col">
        <h4>Logic gates</h4>
        <div class="gates">
          <span class="gate">AND</span>
          <span class="gate">OR</span>
          <span class="gate">NOT</span>
          <span class="gate">NAND</span>
          <span class="gate">NOR</span>
          <span class="gate">XOR</span>
          <span class="gate">XNOR</span>
        </div>
      </div>

    </div>
  </div>

  <div class="footer-bottom">
    &copy; 2026 CAP Project. All rights reserved.
  </div>
</footer>

</body>
</html>
